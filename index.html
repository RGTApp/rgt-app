<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Haftalık Program</title>
<meta name="description" content="Haftalık rutin, görevler, Bugün ekranı, asistan, notlar ve takvim">
<meta name="theme-color" content="#100f0e">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Program">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html,body{overscroll-behavior-y:none}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Press+Start+2P&family=Black+Ops+One&display=swap">
<style>
/* Layout: sticky hafta şeridi üstte, altında yana kaydırılan program tablosu; saat sütunu sabit. Koyu temalar, ayarlardan 6 tema. */
:root{
  color-scheme:dark;
  --bg:#171615;--topbg:#100f0e;--surf:#22201e;--empty:#1f1d1b;--line:#2d2a27;
  --tx:#efe7df;--mut:#9d9389;--acc:#c8692c;--accTx:#1a120c;--track:#2d2a27;
  --g1:#9e3a36;--g2:#e08a3c;--done:#2f9e63;--chipTx:#1a120c;--danger:#d9483b;
  --font:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  --pix:'Press Start 2P',ui-monospace,monospace;
  --stamp:'Black Ops One',Impact,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--tx)}
body{font-family:var(--font);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px;overflow-x:hidden;transition:background .3s}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--topbg)}
button{font-family:inherit;color:inherit}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:25;background:var(--topbg);border-bottom:2px solid var(--line);
  margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px))) calc(-1 * max(16px,env(safe-area-inset-right,0px)));
  padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}
.barIn{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:8px}
.tabs{display:flex;gap:6px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{min-height:40px;padding:9px 14px;font-size:13px;font-weight:800;white-space:nowrap;border-radius:12px;background:var(--surf);color:var(--mut);border:none;cursor:pointer;display:flex;align-items:center;gap:6px}
.tab.on{background:var(--acc);color:var(--accTx)}
.tab.on .ed{opacity:.6;font-size:11px}
.ib{flex:none;width:40px;height:40px;display:grid;place-items:center;font-size:20px;font-weight:900;border-radius:12px;border:none;cursor:pointer;background:var(--surf);color:var(--tx);transition:transform .2s,background .2s}
.ib.plus{background:var(--acc);color:var(--accTx);font-size:24px}
.ib.plus.on{transform:rotate(45deg);background:var(--tx);color:var(--bg)}
.sync{font-size:11px;font-weight:800;color:var(--mut);white-space:nowrap;display:flex;align-items:center;gap:5px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--mut);display:block}
.sync.ok i{background:var(--done)}.sync.saving i{background:var(--g2);animation:blink 1s infinite}.sync.err i{background:var(--danger)}
@keyframes blink{50%{opacity:.3}}
@media (max-width:520px){.sync span{display:none}}

.wrap{max-width:1200px;margin:0 auto}
.hint{margin-top:12px;padding:10px 14px;border-radius:12px;background:var(--surf);font-size:13px;font-weight:700;color:var(--mut)}
.tblwrap{overflow-x:auto;margin-top:6px;padding-top:22px;padding-bottom:6px;-webkit-overflow-scrolling:touch;position:relative}
table{border-collapse:separate;border-spacing:6px;width:100%}
th,td{text-align:center;vertical-align:middle}
.saat{width:84px;min-width:84px;position:sticky;left:0;z-index:3;background:var(--bg);color:var(--acc);font-weight:900;font-size:13px}
:is(th.col,.tkH){min-width:108px;background:var(--surf);border-radius:12px;padding:8px 7px 7px;vertical-align:top;position:relative;transition:box-shadow .3s}
:is(th.col,.tkH).cheer{animation:cheer 1.2s ease-out}
@keyframes cheer{0%{box-shadow:0 0 0 0 var(--g2)}30%{box-shadow:0 0 26px 4px var(--g2)}100%{box-shadow:0 0 0 0 transparent}}
.dn{display:block;font-size:13px;font-weight:900;margin-bottom:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbar{height:9px;border-radius:9px;overflow:hidden;background:var(--track)}
.pbar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--g1),var(--g2));transition:width .6s cubic-bezier(.3,1.4,.5,1)}
.pc{display:block;font-size:10.5px;font-weight:800;color:var(--mut);margin-top:5px;font-variant-numeric:tabular-nums}
.colTools{display:flex;justify-content:center;gap:6px;margin-top:6px}
.mini{border:none;background:var(--line);color:var(--tx);border-radius:8px;font-size:12px;font-weight:800;padding:4px 8px;cursor:pointer}
.mini.x{background:var(--danger);color:#fff}
th.addCol{min-width:90px;border:2px dashed var(--line);border-radius:12px;background:transparent;color:var(--mut);font-weight:800;font-size:13px;cursor:pointer}
.tbtn{background:none;border:none;color:var(--acc);font:900 14px var(--font);font-variant-numeric:tabular-nums;cursor:pointer;padding:8px 2px;width:100%;border-radius:10px}
.tbtn.none{color:var(--mut);font-weight:700;font-size:12px}
.tcard{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;width:100%;height:68px;border-radius:12px;cursor:pointer;color:var(--acc);font:900 14.5px var(--font);font-variant-numeric:tabular-nums;line-height:1.05;background:linear-gradient(var(--surf),var(--surf)) padding-box,linear-gradient(160deg,var(--g1),var(--g2)) border-box;border:2px solid transparent}
.tnone{display:flex;align-items:center;justify-content:center;width:100%;height:68px;border-radius:12px;border:2px dashed var(--line);background:transparent;color:var(--mut);font:800 11px var(--font);cursor:pointer;padding:0 4px}
.tnone:hover{border-color:var(--acc);color:var(--acc)}
.tbtn .t1,.tbtn .t2{display:block;line-height:1.15}
.tbtn .t2{color:var(--mut);font-size:12px}
.tbtn .t2::before{content:"– "}

/* gün bitti: kalıcı görünüm */
:is(th.col,.tkH).hgold{background:linear-gradient(135deg,#f6d36b,#c9902c);color:#2a1a00}
:is(th.col,.tkH).hgold .pc{color:#5a3d00}:is(th.col,.tkH).hgold .pbar{background:#00000033}:is(th.col,.tkH).hgold .pbar i{background:linear-gradient(90deg,#fff3b0,#fff)}
:is(th.col,.tkH).hneon{background:#0d1712;color:#b7ffd6;box-shadow:inset 0 0 0 2px #3ddc84,0 0 14px #3ddc8466;text-shadow:0 0 6px #3ddc84}
:is(th.col,.tkH).hneon .pc{color:#7fdcae}:is(th.col,.tkH).hneon .pbar{background:#173126}:is(th.col,.tkH).hneon .pbar i{background:#3ddc84;box-shadow:0 0 8px #3ddc84}
:is(th.col,.tkH).hgneon{background:#1a1406;color:#ffe58a;box-shadow:inset 0 0 0 2px #f6d36b,0 0 16px #f6d36b77;text-shadow:0 0 6px #f6b93b}
:is(th.col,.tkH).hgneon .pc{color:#e9c86a}:is(th.col,.tkH).hgneon .pbar{background:#3a2c0c}:is(th.col,.tkH).hgneon .pbar i{background:linear-gradient(90deg,#f6d36b,#fff3b0);box-shadow:0 0 8px #f6d36b}
:is(td.c.c,.tk.tk.tk).dg{background:linear-gradient(135deg,#f6d36b,#c9902c)!important;color:#2a1a00!important}
:is(td.c.c,.tk.tk.tk).dn{background:#0d1712!important;color:#b7ffd6!important;box-shadow:inset 0 0 0 2px #3ddc84,0 0 12px #3ddc8455;text-shadow:0 0 6px #3ddc84}
:is(td.c.c,.tk.tk.tk).dgn{background:#1a1406!important;color:#ffe58a!important;box-shadow:inset 0 0 0 2px #f6d36b,0 0 12px #f6d36b66;text-shadow:0 0 6px #f6b93b}
:is(td.c.c,.tk.tk.tk).dgg{background:linear-gradient(135deg,#2f9e63 0%,#2f9e63 35%,#f6d36b 100%)!important;color:#fff!important;box-shadow:inset 0 0 0 2px #b7ffd6aa,0 0 10px #3ddc8455}
:is(td.c,.tk.tk).fillbase.fillbase{background-color:var(--done)!important;background-image:linear-gradient(135deg,#f6d36b,#c9902c)!important;background-repeat:no-repeat!important;background-position:bottom!important;background-size:100% 0%!important;transition:background-size .35s ease-in,color .3s}
:is(td.c,.tk.tk).fillbase.fillbase.full{background-size:100% 100%!important;color:#2a1a00!important}
.crown{position:absolute;left:50%;top:-24px;transform:translateX(-50%);font-size:24px;line-height:1;filter:drop-shadow(0 3px 5px #0009);z-index:4;pointer-events:none}
.crown.n{filter:drop-shadow(0 0 6px #3ddc84) drop-shadow(0 0 12px #3ddc84) hue-rotate(60deg)}
.crown.drop{animation:crownA .7s cubic-bezier(.3,1.4,.5,1) both}
@keyframes crownA{0%{transform:translate(-50%,-110px) rotate(-20deg);opacity:0}60%{transform:translate(-50%,0) rotate(8deg);opacity:1}80%{transform:translate(-50%,-8px) rotate(-4deg)}100%{transform:translate(-50%,0)}}
.shine{position:absolute;inset:0;border-radius:12px;overflow:hidden;pointer-events:none}
.shine::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;background:linear-gradient(100deg,transparent,#fffa,transparent);animation:shineA .8s ease-out forwards}
@keyframes shineA{to{left:130%}}
@keyframes popIn{0%{transform:scale(.85)}50%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes bounce{0%{transform:scale(1)}30%{transform:scale(1.12)}55%{transform:scale(.96)}100%{transform:scale(1)}}
@keyframes flipX{0%{transform:rotateX(0)}50%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}
.colfx{position:absolute;pointer-events:none;z-index:6}
.neonF{position:absolute;inset:-3px;border-radius:16px;border:3px solid var(--nc,#3ddc84);box-shadow:0 0 16px var(--nc,#3ddc84),inset 0 0 14px color-mix(in srgb,var(--nc,#3ddc84) 35%,transparent);clip-path:inset(0 0 100% 0);animation:reveal .6s ease-out forwards,fadeOut 1s 2s forwards}
@keyframes reveal{to{clip-path:inset(0 0 0 0)}}
.ntxt{position:absolute;left:50%;top:50%;font-family:var(--stamp);font-size:24px;letter-spacing:3px;color:var(--tc,#b7ffd6);text-shadow:0 0 8px var(--nc,#3ddc84),0 0 20px var(--nc,#3ddc84);white-space:nowrap;animation:pinA .4s both,fadeOut .6s 2.1s forwards}
@keyframes pinA{0%{transform:translate(-50%,-50%) rotate(-25deg) scale(2.4);opacity:0}60%{transform:translate(-50%,-50%) rotate(-8deg) scale(.92);opacity:1}100%{transform:translate(-50%,-50%) rotate(-10deg) scale(1);opacity:1}}
.dayDemo{position:relative;width:170px;margin:4px auto 10px;padding-top:22px}
.dayDemo table{width:100%;perspective:600px}
.dayDemo td.c{height:46px;cursor:default}
.dayDemo :is(th.col,.tkH){min-width:0}
.rowx{display:block;margin:2px auto 0}

td.c{height:68px;border-radius:12px;background:var(--empty);position:relative;cursor:pointer;padding:6px 8px;transition:background .3s;user-select:none;-webkit-user-select:none}
td.c.empty{color:var(--mut);box-shadow:inset 0 0 0 1px var(--line)}
:where(.light) td.c:not(.empty){box-shadow:0 2px 6px rgba(0,0,0,.08)}
.light .pen{background:rgba(255,255,255,.28)}
.light .modal{background:rgba(40,30,30,.35)}
td.c.empty::after{content:"+";font-size:18px;font-weight:700;opacity:.22}
td.c.empty:hover::after{opacity:.6}
.ct{display:block;font-weight:800;font-size:13px;line-height:1.2;word-break:break-word}
.cs{display:block;font-size:10.5px;font-weight:800;opacity:.92;margin-top:3px}
.pen{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:7px;background:rgba(0,0,0,.18);border:none;color:inherit;font-size:11px;cursor:pointer;display:grid;place-items:center}
td.c.done{background:var(--done)!important;color:#fff!important}
.addRow{margin:8px 0 0 72px;padding:12px 18px;border-radius:12px;border:2px dashed var(--line);background:transparent;color:var(--mut);font-weight:800;font-size:13px;cursor:pointer}

/* modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;padding:16px max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@media (min-width:640px){.modal{align-items:center}}
.sheet{background:var(--topbg);border:2px solid var(--line);border-radius:20px;width:100%;max-width:440px;max-height:min(86vh,720px);overflow-y:auto;padding:18px;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px}
.sh h3{margin:0;font-size:17px;font-weight:900}
.sh small{display:block;font-size:12px;color:var(--mut);font-weight:700;margin-top:2px}
.close{background:var(--surf);border:none;border-radius:12px;width:44px;height:44px;font-size:16px;cursor:pointer;flex:none}
.lbl{font-size:12px;font-weight:900;color:var(--mut);margin:16px 0 8px;letter-spacing:.06em;text-transform:uppercase}
.inp{width:100%;background:var(--surf);border:2px solid transparent;border-radius:12px;padding:11px 13px;color:var(--tx);font:800 15px var(--font)}
.inp:focus{border-color:var(--acc);outline:none}
.sw{display:flex;gap:9px;flex-wrap:wrap}
.sw button{width:34px;height:34px;border-radius:50%;border:3px solid transparent;cursor:pointer;box-shadow:0 0 0 1px rgba(255,255,255,.08)}
.sw button.on{border-color:var(--tx)}
.subs{display:flex;flex-direction:column;gap:6px}
.sub{display:flex;align-items:center;gap:8px;background:var(--surf);border-radius:12px;padding:4px 4px 4px 6px}
.chk{display:flex;align-items:center;gap:10px;flex:1;min-width:0;background:none;border:none;text-align:left;font:700 14px var(--font);padding:7px 4px;cursor:pointer}
.chk b{flex:none;width:22px;height:22px;border-radius:7px;border:2px solid var(--mut);display:grid;place-items:center;font-size:13px;transition:all .2s}
.chk.on b{background:var(--done);border-color:var(--done);color:#fff}
.chk.on span{text-decoration:line-through;opacity:.55}
.chk span{word-break:break-word}
.subAdd{display:flex;gap:6px;margin-top:8px}
.subAdd .inp{font-size:14px;padding:9px 12px}
.btn{width:100%;padding:12px;border:none;border-radius:12px;background:var(--acc);color:var(--accTx);font:900 15px var(--font);cursor:pointer}
.btn.sm{width:auto;padding:9px 14px;font-size:14px;flex:none}
.btn.g{background:var(--done);color:#fff}
.btn.ghost{background:var(--surf);color:var(--tx)}
.btn.red{background:transparent;color:var(--danger);border:2px solid var(--danger)}
.btns{display:flex;flex-direction:column;gap:8px;margin-top:18px}
.row2{display:flex;gap:8px}.row2>*{flex:1}
.prog{font-size:12px;font-weight:800;color:var(--mut)}

.tws{position:relative;display:flex;justify-content:center;align-items:flex-end;gap:4px;user-select:none;-webkit-user-select:none;margin-top:2px}
.tgrp{display:flex;flex-direction:column;align-items:center}
.tpair{display:flex;align-items:center}
.ttag{height:26px;display:flex;align-items:center;padding:0 12px;border-radius:8px;font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.ttag.s{background:var(--g1);color:#fff}.ttag.e{background:var(--g2);color:var(--chipTx)}
.tgrp.s .wheel div.sel{color:color-mix(in srgb,var(--g1) 55%,var(--tx))}
.tgrp.e .wheel div.sel{color:color-mix(in srgb,var(--g2) 55%,var(--tx))}
.wsep{font:900 18px var(--font);color:var(--mut);z-index:2;padding:0 4px;align-self:flex-end;height:112px}
.tws .whl{top:auto;bottom:80px}
.tbar{position:relative;height:34px;margin-top:20px;border-radius:10px;background:repeating-linear-gradient(90deg,var(--surf) 0 calc(100%/24 - 1px),var(--line) calc(100%/24 - 1px) calc(100%/24))}
.tclip{position:absolute;inset:0;border-radius:10px;overflow:hidden}
.tseg{position:absolute;top:0;bottom:0;transition:left .2s,width .2s}
.tseg.occ,.tleg i.occ{background:color-mix(in srgb,var(--tx) 26%,var(--surf))}
.tseg.pick,.tleg i.pick{background:linear-gradient(90deg,var(--g1),var(--g2))}
.tseg.pick{box-shadow:0 0 12px color-mix(in srgb,var(--g2) 40%,transparent)}
.tseg.ovl,.tleg i.ovl{background:color-mix(in srgb,var(--g1) 55%,#000);box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--g2) 55%,#fff);border-radius:3px}
.tseg.ovl{z-index:3}
.tseg.ovl::after{content:"";position:absolute;left:0;right:0;top:-6px;height:3px;border-radius:3px;background:color-mix(in srgb,var(--g2) 55%,#fff)}
.tticks{display:flex;justify-content:space-between;font-size:10px;color:var(--mut);font-weight:800;margin:4px 2px 0;font-variant-numeric:tabular-nums}
.tleg{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;font-size:11px;font-weight:800;color:var(--mut);margin-top:10px}
.tleg span{display:flex;align-items:center;gap:5px}.tleg i{width:16px;height:10px;border-radius:3px;display:block}
.tinfo{display:flex;justify-content:center;margin-top:10px}
.tpill{background:var(--surf);border-radius:20px;padding:6px 12px;font-size:12px;font-weight:900;color:var(--g2)}
.twarn{background:color-mix(in srgb,var(--g2) 16%,var(--surf));color:var(--tx);border-radius:12px;padding:8px 12px;font-size:12px;font-weight:800;margin-top:10px;text-align:center;line-height:1.45}
.twarn b{color:color-mix(in srgb,var(--g2) 75%,var(--tx))}
.twarn.ok{background:var(--surf);color:var(--mut)}
.wheel{user-select:none;-webkit-user-select:none;height:200px;width:54px;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;padding-block:80px;-webkit-mask:linear-gradient(transparent,#000 30%,#000 70%,transparent);mask:linear-gradient(transparent,#000 30%,#000 70%,transparent);position:relative;z-index:2}
.wheel::-webkit-scrollbar{display:none}
.wheel div{height:40px;display:grid;place-items:center;scroll-snap-align:center;font:800 22px var(--font);color:var(--mut);font-variant-numeric:tabular-nums;transition:color .15s,transform .15s}
.wheel div.sel{color:var(--tx);transform:scale(1.15)}
.wcol{font:900 24px var(--font);z-index:2}
.whl{position:absolute;left:50%;top:80px;transform:translateX(-50%);width:min(100%,310px);height:40px;border-radius:12px;background:var(--surf);z-index:1}

.themes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.th{border-radius:12px;padding:10px;border:2px solid transparent;cursor:pointer;font-weight:800;font-size:12px;text-align:left;display:flex;align-items:center;gap:9px}
.th.on{border-color:var(--tx)}
.th span{display:flex;flex:none}
.th span i{width:14px;height:14px;border-radius:50%;margin-right:-4px;border:2px solid rgba(255,255,255,.15)}
.fxl{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.fxb{border:2px solid transparent;background:var(--surf);border-radius:10px;padding:9px 10px;font:800 12.5px var(--font);text-align:left;cursor:pointer;display:flex;gap:6px;align-items:center}
.fxb em{font-style:normal;color:var(--mut);font-variant-numeric:tabular-nums;width:18px;flex:none}
.fxb.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 18%,var(--surf))}
button,td.c,.tab{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.sheet{overscroll-behavior:contain}
.mini{min-height:32px;min-width:32px}
.mini.x.ask{background:var(--danger);color:#fff;padding:4px 10px;animation:popIn .3s}
.ct{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.btn:disabled{opacity:.45;cursor:not-allowed}
.loading td.c,.loading .tcard,.loading .tnone{opacity:.55}

/* amblem */
.logo{flex:none;width:36px;height:36px;display:block}
.logo svg{width:100%;height:100%;display:block;filter:drop-shadow(0 2px 6px rgba(0,0,0,.35))}
@media (max-width:380px){.logo{display:none}}

/* giriş ekranı */

.tTip{position:fixed;width:min(330px,calc(100vw - 24px));background:var(--topbg);color:var(--tx);border:2px solid var(--acc);border-radius:18px;padding:14px 16px 12px;box-shadow:0 16px 40px rgba(0,0,0,.5);transition:left .35s ease,top .35s ease;animation:up .25s ease-out}

/* düzenleme modu: sürükle-bırak, satır okları */

/* kopyala-yapıştır */

const DEF_ROWS=6;
const TRE=/^\d{2}:\d{2}$/;
function defaultWeek(){const rows=[];for(let i=0;i<DEF_ROWS;i++)rows.push({id:rid(),start:"",end:""});return{rows,extras:[],cells:{}};}
function defaultSettings(){return{theme:"turuncu",effect:9,dayFx:1,sound:true,vib:true,weekNames:["Mevcut hafta","Alternatif 1","Alternatif 2"],active:0,named:false,mig:4};}
function normWeek(d){
  const w={rows:[],extras:[],cells:{}};
  if(d&&Array.isArray(d.rows))w.rows=d.rows.filter(r=>r&&r.id).slice(0,MAX_ROWS).map(r=>{
    const st=typeof r.start==="string"&&(TRE.test(r.start)||r.start==="")?r.start:(typeof r.time==="string"&&TRE.test(r.time)?r.time:"");
    let en=typeof r.end==="string"&&TRE.test(r.end)?r.end:"";
    // eski kayıtlar: bitiş yoksa başlangıç + 1 saat
    if(st&&!en){const [a,b]=st.split(":").map(Number);const m=Math.min(1440,a*60+b+60);en=String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");}
    return{id:String(r.id),start:st,end:en};
  });
  if(!w.rows.length)return defaultWeek();
  // ilk sürümün boş 10 satırlık varsayılanı → yeni 6 satırlık boş hafta
  const oldDefault=w.rows.length===10&&!(d.cells&&Object.keys(d.cells).length)&&!(d.extras&&d.extras.length)&&d.rows.every((r,i)=>r.time===String(8+i).padStart(2,"0")+":00");
  if(oldDefault)return defaultWeek();
  if(d&&Array.isArray(d.extras))w.extras=d.extras.filter(x=>x&&x.id).slice(0,MAX_EXTRA).map(x=>({id:String(x.id),name:String(x.name||"Ekstra")}));
  const okRows=new Set(w.rows.map(r=>r.id)),okCols=new Set(["d0","d1","d2","d3","d4","d5","d6",...w.extras.map(x=>"x"+x.id)]);
  if(d&&d.cells&&typeof d.cells==="object")for(const k in d.cells){const c=d.cells[k];if(!c||!c.title)continue;const [rk,ckk]=k.split("|");if(!okRows.has(rk)||!okCols.has(ckk))continue;w.cells[k]={title:String(c.title),color:Math.max(0,Math.min(7,+c.color||0)),done:!!c.done,subs:Array.isArray(c.subs)?c.subs.filter(s=>s&&s.t).map(s=>({t:String(s.t),d:!!s.d})):[]};}
  return w;
}
function normSettings(d){
  const s=defaultSettings();if(!d)return s;
  if(THEMES[d.theme])s.theme=d.theme;
  if(typeof d.effect==="number"&&d.effect>=-1&&d.effect<20)s.effect=d.effect;
  if(typeof d.dayFx==="number"&&d.dayFx>=0&&d.dayFx<8)s.dayFx=d.dayFx;
  if(typeof d.named==="boolean")s.named=d.named;
  if(typeof d.sound==="boolean")s.sound=d.sound;
  if(typeof d.vib==="boolean")s.vib=d.vib;
  if(Array.isArray(d.weekNames))for(let i=0;i<3;i++){const n=d.weekNames[i];if(n&&String(n).trim()!==(i+1)+". Hafta")s.weekNames[i]=String(n).slice(0,30);}
  s.mig=typeof d.mig==="number"?d.mig:0;
  if(d.active>=0&&d.active<3)s.active=d.active|0;
  return s;
}
function sampleWeek(){const w=defaultWeek();w.rows[0].start="09:00";w.rows[0].end="10:00";w.rows[1].start="18:00";w.rows[1].end="19:00";for(let i=0;i<7;i++){w.cells[w.rows[0].id+"|d"+i]={title:"Örnek rutin "+(2*i+1),color:1,done:false,subs:[]};w.cells[w.rows[1].id+"|d"+i]={title:"Örnek rutin "+(2*i+2),color:2,done:false,subs:[]};}return w;}
const S={settings:defaultSettings(),weeks:[sampleWeek(),defaultWeek(),defaultWeek()]};

function normTasks(d){const o={items:[]};if(d&&Array.isArray(d.items))o.items=d.items.filter(x=>x&&x.id&&typeof x.date==="string"&&IRE.test(x.date)&&x.title).slice(0,3000).map(x=>{const tm=typeof x.time==="string"&&TRE.test(x.time)?x.time:"";return{id:String(x.id),date:x.date,time:tm,end:tm&&typeof x.end==="string"&&TRE.test(x.end)?x.end:"",title:String(x.title).slice(0,80),note:typeof x.note==="string"?x.note.slice(0,1000):"",color:Math.max(0,Math.min(7,+x.color||0)),done:!!x.done,subs:Array.isArray(x.subs)?x.subs.filter(q=>q&&q.t).map(q=>{const o={t:String(q.t),d:!!q.d};if(typeof q.n==="string"&&q.n.trim())o.n=q.n.slice(0,500);return o;}):[]};});return o;}
function sampleTasks(){const m=mondayOf(todayD()),items=[];
  for(let i=0;i<7;i++)items.push({id:rid(),date:isoD(addD(m,i)),time:"11:00",end:"12:00",title:"Örnek görev "+(i+1),color:1,done:false,subs:[]});

/* eski sürümün örnek verilerini (Kahvaltı, Annemi ara…) yenileriyle değiştir — yalnızca birebir aynı duranları */
function migrateSamples(){
  const st=S.settings,v=Math.max(st.mig||0,+(lsGet("hp-smp")||0));
  if(v>=4){if(st.mig!==4){st.mig=4;save("settings");}return;}
  lsSet("hp-smp","4");st.mig=4;
  const isSmp=(k,c)=>/^Örnek rutin \d+$/.test(c.title)||({"Kahvaltı":2,"Ders":0,"Spor":1}[c.title]===c.color&&/\|d[012]$/.test(k));
  if(v<3){
    // varsayılan görünüm: turuncu tema, neon parlama, bütün sütun altın
    if(st.theme!=="turuncu"||st.effect!==9||st.dayFx!==1){st.theme="turuncu";st.effect=9;st.dayFx=1;applyTheme();}
    const OT={"Diş randevusu":"10:00|3","Market alışverişi":"|2","Proje sunumu":"14:00|5","Annemi ara":"19:30|1"};
    const n0=S.tasks.items.length;S.tasks.items=S.tasks.items.filter(x=>!(OT[x.title]===x.time+"|"+x.color)&&!/^Örnek görev \d+$/.test(x.title));
    if(S.tasks.items.length!==n0){S.tasks.items.push(...sampleTasks().items);save("tasks");}
    // mevcut hafta: eski örnekleri yenileriyle değiştir (kendi eklediklerine dokunma)
    const w=S.weeks[0];let ch=false;for(const k in w.cells)if(isSmp(k,w.cells[k])){delete w.cells[k];ch=true;}
    if(ch){if(!Object.keys(w.cells).length)S.weeks[0]=sampleWeek();save("w0");}
  }
  // alternatifler örneksiz başlar
  [1,2].forEach(i=>{const w=S.weeks[i];let ch=false;for(const k in w.cells)if(isSmp(k,w.cells[k])){delete w.cells[k];ch=true;}
    if(ch){if(!Object.keys(w.cells).length)S.weeks[i]=defaultWeek();save("w"+i);}});
  save("settings");
}

const LS="haftalik-program-v1";
let db=null,uid=null,hadLocal=false,ready=false;
function markReady(){if(ready)return;ready=true;document.documentElement.classList.remove("loading");try{migrateSamples();}catch(e){}try{render();}catch(e){}setTimeout(()=>nextIntro(),400);}
const timers={},writing={},again={},dirty={};
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){}}
function loadLocal(){try{const r=localStorage.getItem(LS);if(!r)return;const d=JSON.parse(r);hadLocal=true;S.settings=normSettings(d.settings);if(Array.isArray(d.weeks))for(let i=0;i<3;i++)S.weeks[i]=normWeek(d.weeks[i]);if(d.tasks)S.tasks=normTasks(d.tasks);if(d.log)S.log=normLog(d.log);if(d.notes)S.notes=normNotes(d.notes);if(d.uev)S.uev=normUev(d.uev);}catch(e){}}
function setSync(st){const el=$("sync");el.className="sync "+st;el.querySelector("span").textContent={ok:"Buluta kaydedildi",saving:"Kaydediliyor…",local:"Bu cihazda",err:"Kaydedilemedi",load:"Yükleniyor"}[st];}
const docPath=k=>"data/users/"+uid+"/"+k;
function save(k){
  saveLocal();
  if(!db){setSync("local");return;}
  dirty[k]=true;setSync("saving");
  clearTimeout(timers[k]);timers[k]=setTimeout(()=>flush(k),450);
}
async function flush(k){
  if(writing[k]){again[k]=true;return;}
  writing[k]=true;dirty[k]=false;
  try{const body=clone(dataOf(k));if(k==="settings")delete body.active;await db.doc(docPath(k)).set(body);if(!Object.values(dirty).some(Boolean))setSync("ok");}
  catch(e){setSync("err");}
  writing[k]=false;
  if(again[k]){again[k]=false;flush(k);}
}
async function initStore(){
  let d=null,u=null;
  try{if(window.claude&&window.claude.use){[d,u]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);}}catch(e){}
  if(d&&u){try{uid=await u.id();}catch(e){uid=null;}}
  if(!d||!uid){setSync("local");markReady();return;}
  db=d;setSync("load");
  const got=new Set();const gotOne=(k,snap)=>{if(snap&&snap.metadata&&snap.metadata.fromCache)return;got.add(k);if(got.size===KEYS.length){setSync("ok");markReady();}};
  setTimeout(()=>{if(!ready){setSync(got.size?"ok":"err");markReady();}},8000);
  KEYS.forEach(k=>{
    let first=true;
    db.doc(docPath(k)).onSnapshot(snap=>{
      const wasFirst=first;first=false;
      try{gotOne(k,snap);}catch(e){}
      if(snap.metadata&&snap.metadata.hasPendingWrites)return;
      if(dirty[k]||writing[k])return;
      if(!snap.exists){if(wasFirst&&hadLocal&&!(snap.metadata&&snap.metadata.fromCache))save(k);return;}
      const incoming=snap.data();
      const norm=k==="settings"?normSettings(incoming):k==="tasks"?normTasks(incoming):k==="log"?normLog(incoming):k==="notes"?normNotes(incoming):k==="uev"?normUev(incoming):normWeek(incoming);
      if(k==="settings")norm.active=S.settings.active;
      if(stable(norm)===stable(dataOf(k)))return;
      setData(k,norm);saveLocal();
      if(k==="settings"){applyTheme();if(mode==="onboard"&&S.settings.named)closeSheet();}
      if(typeof drag!=="undefined"&&drag){pendingRender=true;return;}
      render();
    },()=>{setSync("err");got.add(k);if(got.size===KEYS.length)markReady();});
  });
}

function itemsOf(d){
  const wi=(d.getDay()+6)%7,key="d"+wi,iso=isoD(d),w=W(),it=[];
  w.rows.forEach(r=>{const c=w.cells[r.id+"|"+key];if(c)it.push({id:"r:"+r.id+"|"+key,n:c.title,s:r.start||"",e:r.end||"",done:isDone(c),src:"r",subs:c.subs.length});});
  S.tasks.items.filter(x=>x.date===iso).forEach(x=>it.push({id:"g:"+x.id,tid:x.id,n:x.title,s:x.time||"",e:x.end||"",done:isDone(x),src:"g",subs:x.subs.length}));
  return it.sort((a,b)=>(a.s||"99")<(b.s||"99")?-1:(a.s||"99")>(b.s||"99")?1:0);
}

function normLog(d){const o={days:{}};if(d&&d.days&&typeof d.days==="object"){Object.keys(d.days).filter(k=>IRE.test(k)).sort().slice(-200).forEach(k=>{const v=d.days[k];if(Array.isArray(v)&&v.length===2)o.days[k]=[Math.max(0,v[0]|0),Math.max(0,v[1]|0)];});}return o;}
S.log={days:{}};
function updateLog(){
  const t=todayD(),iso=isoD(t),days=S.log.days;let ch=false;
  const st=statOf(itemsOf(t)),cur=days[iso];
  if(!cur||cur[0]!==st.t||cur[1]!==st.d){days[iso]=[st.t,st.d];ch=true;}
  // dün hiç kaydedilmemişse mevcut veriden doldur
  const y=addD(t,-1),yi=isoD(y);
  if(!days[yi]){const ys=statOf(itemsOf(y));days[yi]=[ys.t,ys.d];ch=true;}
  if(ch)save("log");
}
function logDay(iso){if(iso===isoD(todayD())){const s=statOf(itemsOf(todayD()));return[s.t,s.d];}return S.log.days[iso]||null;}
function streakInfo(){
  const t=todayD(),days=S.log.days;let cur=0;
  for(let i=1;i<120;i++){const v=days[isoD(addD(t,-i))];if(!v)break;if(v[0]===0)continue;if(v[1]>=v[0])cur++;else break;}
  const td=logDay(isoD(t));const todayFull=td&&td[0]>0&&td[1]>=td[0];
  let best=0,run=0;Object.keys(days).sort().forEach(k=>{const v=days[k];if(v[0]===0)return;if(v[1]>=v[0]){run++;best=Math.max(best,run);}else run=0;});
  const now=cur+(todayFull?1:0);return{cur:now,prev:cur,todayFull,best:Math.max(best,now)};
}
function weekPct(mon){let t=0,d=0,bestDay=null;for(let i=0;i<7;i++){const di=addD(mon,i);if(di>todayD())break;const v=logDay(isoD(di));if(!v||!v[0])continue;t+=v[0];d+=v[1];const p=v[1]/v[0];if(!bestDay||p>bestDay.p)bestDay={p,i};}return{t,d,p:t?Math.round(d/t*100):null,bestDay};}
/* yanlış tıklama koruması: asistan bir tiki ancak 1 dakika durursa sayar */
function stableDone(items){
  const now=Date.now(),seen=new Set();
  items.forEach(x=>{seen.add(x.id);if(x.done){if(!(x.id in AS.first))AS.first[x.id]=AS.init?now:0;}else delete AS.first[x.id];});
  Object.keys(AS.first).forEach(k=>{if(!seen.has(k))delete AS.first[k];});
  AS.init=true;
  return items.map(x=>({...x,sdone:x.done&&now-AS.first[x.id]>=60000}));
}
function rapidCheck(items,M){
  const now=Date.now(),recent=items.filter(x=>x.done&&AS.first[x.id]&&now-AS.first[x.id]<180000).length;
  const early=items.filter(x=>x.done&&x.s&&toMin(x.s)>M+45&&AS.first[x.id]&&now-AS.first[x.id]<600000).length;
  const st=statOf(items);
  if(st.t>=3&&recent>=Math.max(3,Math.ceil(st.t*.6))&&st.d/st.t>=.8){AS.irony=now;AS.ironyTy="fast";}
  else if(early>=3){AS.irony=now;AS.ironyTy="early";}
  return now-AS.irony<10*60000?AS.ironyTy:"";
}

function tipFor(n,seed){
  const toks=String(n).toLocaleLowerCase("tr").split(/[^a-zçğıöşü0-9']+/).filter(Boolean);
  for(const[st,tips]of KWT)if(toks.some(t=>st.some(k=>t.startsWith(k))))return PICK(tips,seed);

    $("tClip").innerHTML=tp.occ.map(([a,b])=>`<div class="tseg occ" style="left:${pc(a)};width:${((b-a)/1440*100)}%"></div>`).join("")+`<div class="tseg pick" style="left:calc(${pc(s)} - 2px);width:5px"></div>`;

function startDrag(){
  const r=drag.td.getBoundingClientRect();drag.on=true;drag.ox=drag.x-r.left;drag.oy=drag.y-r.top;

  g.innerHTML=drag.td.querySelector(".ct").outerHTML+(drag.td.querySelector(".cs")?drag.td.querySelector(".cs").outerHTML:"");
  document.body.appendChild(g);drag.ghost=g;drag.td.classList.add("dragSrc");document.body.classList.add("dragging");

function autoScroll(){
  if(!drag||!drag.on)return;
  const tw=$("tblwrap"),r=tw.getBoundingClientRect(),edge=48;

function endDrag(drop){
  if(!drag)return;const d=drag;drag=null;

function onCellTap(td){
  const k=td.dataset.k,c=W().cells[k];
  if(clip){if(c){toast("Bu kutu dolu. Boş bir kutuya dokun");return;}W().cells[k]=clone(clip);save(wkey());render();tick();const n=document.querySelector(`td[data-k="${CSS.escape(k)}"]`);if(n)n.classList.add("pasted");return;}
  if(!c){openEditor(k);return;}
  if(editMode){openEditor(k);return;}
  if(tab==="r"&&isPv()){toast(tkMon<mondayOf(todayD())?"Geçmiş hafta, burada tik atılamaz":"Bu hafta gelince tik atabilirsin");return;}
  if(c.subs.length){openChecklist(k);return;}
  const was=isDone(c);c.done=!c.done;save(wkey());render();
  if(!was&&c.done)celebrate(k);
}

  switch(act){
    case "close":closeSheet();break;
    case "tab":{const i=+a.dataset.i;if(i===S.settings.active)openRename("week",i);else{S.settings.active=i;saveLocal();render();}break;}

    case "spread":{readTitle();if(!ed.title.trim()&&!ed.subs.length){toast("Önce görevin adını yaz");break;}const me=ed.k.split("|")[1];ed.also=new Set(cols().map(c=>c.key).filter(x=>x!==me));commitEditor();break;}

document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&!$("wkMenu").hidden){toggleWk(false);$("wkBtn").focus();return;}
  if(e.key==="Escape"&&!$("modal").hidden){closeSheet();return;}
  if(e.key==="Escape"&&clip){endPaste();return;}
  if((e.key===" "||e.key==="Enter")&&e.target.matches&&e.target.matches(".tk[data-tid]")){e.preventDefault();if(ready)onTaskTap(e.target.dataset.tid);return;}
  if(e.key===" "&&e.target.matches&&e.target.matches("td.c")){e.preventDefault();if(ready)onCellTap(e.target);return;}
  if(e.key==="Enter"){
    if(e.target.id==="subIn"){e.preventDefault();addSub();return;}
    if(e.target.id==="uName"){e.preventDefault();const b=document.querySelector('[data-act="usave"]');b&&b.click();return;}
    if(e.target.id==="nTfT"){e.preventDefault();const b=document.querySelector('[data-act="ntok"]');b&&b.click();return;}
    if(e.target.id==="tSubIn"){e.preventDefault();tAddSub();return;}
    if(e.target.id==="tTitle"){e.preventDefault();commitTask();return;}
    if(e.target.id==="eTitle"){e.preventDefault();commitEditor();return;}
    if(e.target.id==="rnIn"){e.preventDefault();commitRename();return;}
    if(e.target.tagName==="BUTTON"||e.target.tagName==="INPUT")return;
    const td=e.target.closest&&e.target.closest("td.c");if(td){e.preventDefault();if(ready)onCellTap(td);return;}
    const ac2=e.target.closest&&e.target.closest("th[data-act]");if(ac2){ac2.click();}
  }
});

function tourPrep(st){
  if(st.tab&&tab!==st.tab){setTab(st.tab);if(st.tab!=="r")tkMon=mondayOf(todayD());render();window.scrollTo(0,0);}
  if(st.pane!=null){const pn=$("tdPanes");if(pn&&pn.scrollWidth>pn.clientWidth+5){tdIdx=st.pane;pn.scrollTo({left:st.pane*pn.clientWidth,behavior:"auto"});document.querySelectorAll("#tdDots button").forEach((b,j)=>b.classList.toggle("on",j===st.pane));}}
}
function drawTour(dir){
  const st=TOUR[tourI],tip=$("tTip"),o=$("tour");
  const steps=TOUR.filter(x=>!x.card).length,num=TOUR.slice(0,tourI+1).filter(x=>!x.card).length;
  if(st.card){
    o.classList.add("tCardMode");tip.className="tTip tCard";
    if(st.card==="hello")tip.innerHTML=`<div class="tEmb">${EMB}</div><h3>Hoş geldin! 👋</h3><p class="lead">Haftanı planlamanın, gününü takip etmenin ve kendini motive etmenin kolay yolu.</p>
      <div class="tFeat"><div><span>🗂</span><b>Haftalık Rutin</b><small>Her hafta tekrar eden düzenin</small></div><div><span>☀️</span><b>Bugün</b><small>Notlar, işler ve asistan</small></div><div><span>🗓</span><b>Haftalık Görev</b><small>Tarihli, tek seferlik işler</small></div></div>
      <p class="sm">Kısa bir tura ne dersin? ${steps} adım, 1 dakika sürer.</p><div class="tBtns"><button data-t="skip" class="tSkip">Geç</button><button data-t="next" class="tNext">Tura başla →</button></div>`;
    else tip.innerHTML=`<div class="tEmb big">${EMB}</div><h3>Hazırsın! 🚀</h3><p class="lead">Önce <b>Haftalık Rutin</b>'e düzenini kur, tarihli işlerini <b>Haftalık Görev</b>'e ekle. Gerisini <b>Bugün</b> ekranında asistanla birlikte takip et.</p><div class="tBtns"><button data-t="back" class="tBack">Geri</button><button data-t="finish" class="tNext">Hadi başlayalım 🎉</button></div>`;
    const sp=$("tSpot");Object.assign(sp.style,{left:"50%",top:"50%",width:"0px",height:"0px"});
    tip.style.left="";tip.style.top="";
    setTimeout(()=>{const n=tip.querySelector(".tNext");n&&n.focus({preventScroll:true});},60);
    return;
  }
  o.classList.remove("tCardMode");tip.className="tTip";
  tourPrep(st);
  const el=st.sel.split(",").map(s=>document.querySelector(s.trim())).find(Boolean);
  if(!el){tourGo(dir||1);return;}
  try{el.scrollIntoView({block:"nearest",inline:"nearest"});}catch(e){}
  tip.innerHTML=`<div class="tHead"><span class="tIc">${st.ic}</span><div><div class="tc">${num} / ${steps}</div><h4>${st.t}</h4></div></div><p>${st.d}</p><div class="tBar"><i style="width:${Math.round(num/steps*100)}%"></i></div><div class="tBtns"><button data-t="skip" class="tSkip">Geç</button><button data-t="back" class="tBack">Geri</button><button data-t="next" class="tNext">İleri →</button></div>`;
  tip.classList.remove("tIn");void tip.offsetWidth;tip.classList.add("tIn");
  placeTour();setTimeout(placeTour,120);setTimeout(placeTour,380);
  setTimeout(()=>{const n=tip.querySelector(".tNext");n&&n.focus({preventScroll:true});},60);
}
function placeTour(){
  const st=TOUR[tourI];if(!st||st.card||!$("tour"))return;const el=st.sel.split(",").map(s=>document.querySelector(s.trim())).find(Boolean);if(!el)return;
  const r0=el.getBoundingClientRect(),vw=innerWidth,vh=innerHeight,pad=6;
  const r={left:Math.max(4,r0.left),top:Math.max(4,r0.top),right:Math.min(vw-4,r0.right),bottom:Math.min(vh-4,r0.bottom)};
  const sp=$("tSpot");Object.assign(sp.style,{left:(r.left-pad)+"px",top:(r.top-pad)+"px",width:(r.right-r.left+pad*2)+"px",height:(r.bottom-r.top+pad*2)+"px"});
  const tip=$("tTip"),tw=tip.offsetWidth,th=tip.offsetHeight;
  let top=r.bottom+pad+14;if(top+th>vh-12){top=r.top-pad-14-th;if(top<12)top=Math.max(12,vh-th-12);}
  let left=(r.left+r.right)/2-tw/2;left=Math.max(12,Math.min(vw-tw-12,left));
  tip.style.left=left+"px";tip.style.top=top+"px";
}
function endTour(skipped){
  lsSet("hp-tour-done","1");const o=$("tour");
  if(!skipped&&o){const tip=$("tTip");try{FX[0].fx(tip);if(S.settings.sound)FX[0].snd();}catch(e){}}
  if(o)setTimeout(()=>o.remove(),skipped?0:250);
  if(tourTab&&tab!==tourTab){setTab(tourTab);render();}
  tourTab=null;window.scrollTo(0,0);
  if(!skipped)toast("Kolay gelsin! İlk işini eklemekle başla ✨");
}
addEventListener("resize",()=>{if($("tour"))placeTour();});
document.addEventListener("keydown",e=>{if(!$("tour"))return;if(e.key==="Escape"){endTour(true);}else if(e.key==="ArrowRight"){tourGo(1);}else if(e.key==="ArrowLeft"){tourGo(-1);}},true);

/* ---------- takvim ---------- */
let calSt=null;
function openCal(){const t=todayD();calSt={y:t.getFullYear(),m:t.getMonth(),pick:false,sel:isoD(t)};drawCal();}
function calMove(dir){let m=calSt.m+dir,y=calSt.y;if(m<0){m=11;y--;}if(m>11){m=0;y++;}if(y<CAL_Y0||y>CAL_Y1)return;calSt.m=m;calSt.y=y;calSt.sel=null;drawCal(true);}
function evsOf(iso){return OZEL[iso]||[];}
function drawCal(keep){
  const st=calSt,t=todayD();
  const atStart=st.y===CAL_Y0&&st.m===0,atEnd=st.y===CAL_Y1&&st.m===11;
  let h=`<div class="sh"><div><h3>Takvim</h3><small>Bu hafta: ${rangeText(mondayOf(t))} · ${weekNo(t)}. hafta</small></div><button class="close" data-act="close" aria-label="Kapat">✕</button></div>`;
  h+=`<div class="calH"><button class="calT" data-act="calpick" aria-expanded="${st.pick}">${AY[st.m]} ${st.y}<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="transform:rotate(${st.pick?180:0}deg)"><path d="M6 9l6 6 6-6"/></svg></button><button class="calToday" data-act="caltoday">Bugün</button><button class="calNav" data-act="calprev" aria-label="Önceki ay" ${atStart?"disabled":""}>‹</button><button class="calNav" data-act="calnext" aria-label="Sonraki ay" ${atEnd?"disabled":""}>›</button></div>`;
  if(st.pick){
    h+=`<div class="calPl">Yıl</div><div class="calPick">`;for(let y=CAL_Y0;y<=CAL_Y1;y++)h+=`<button data-act="caly" data-v="${y}" class="${y===st.y?"on":""} ${y===t.getFullYear()?"now":""}">${y}</button>`;
    h+=`</div><div class="calPl" style="margin-top:12px">Ay</div><div class="calPick">`;AY.forEach((a,i)=>h+=`<button data-act="calm" data-v="${i}" class="${i===st.m?"on":""} ${i===t.getMonth()&&st.y===t.getFullYear()?"now":""}">${a}</button>`);h+=`</div>`;
  }else{
    const first=new Date(st.y,st.m,1),start=mondayOf(first);
    const cells=[];for(let i=0;i<42;i++)cells.push(addD(start,i));
    let last=0;cells.forEach((d,i)=>{if(d.getMonth()===st.m)last=i;});const n=Math.ceil((last+1)/7)*7;
    h+=`<div class="calWd"><span>Hf</span>${GUNK.map(g=>`<span>${g}</span>`).join("")}</div><div id="calDays">`;
    const curMon=isoD(mondayOf(t));const tcount={};S.tasks.items.forEach(x=>{tcount[x.date]=(tcount[x.date]||0)+1;});
    for(let i=0;i<n;i+=7){
      const wk=cells.slice(i,i+7);
      h+=`<div class="calWk ${isoD(wk[0])===curMon?"cur":""}"><span class="calWn">${weekNo(wk[0])}</span>`;
      wk.forEach(d=>{
        const iso=isoD(d),ev=evsOf(iso),w=(d.getDay()+6)%7,inRange=d.getFullYear()>=CAL_Y0&&d.getFullYear()<=CAL_Y1;
        const cls=["cd"];if(d.getMonth()!==st.m)cls.push("o");if(w>4)cls.push("we");if(ev.length)cls.push("ev");if(sameD(d,t))cls.push("today");if(st.sel===iso)cls.push("sel");
        const _u=uevsOn(iso);if(_u.length)cls.push("uev");const sn=_u.length?uLbl(_u[0]):ev.length?shortN(ev[0][0]):"";const evN=ev.length+_u.length;
        const lbl=`${d.getDate()} ${AY[d.getMonth()]} ${d.getFullYear()} ${DAYS[w]}${_u.length?", "+_u.map(e=>UT[e.type].n+": "+e.name).join(", "):""}${ev.length?", "+ev.map(e=>e[0]).join(", "):""}${tcount[iso]?", "+tcount[iso]+" görev":""}`;
        h+=inRange?`<button class="${cls.join(" ")}" data-act="calday" data-d="${iso}" aria-label="${esc(lbl)}">${tcount[iso]?`<span class="tc">${tcount[iso]}</span>`:""}<span class="n">${d.getDate()}</span>${sn?`<span class="lb ${sn.split(" ").some(x=>x.length>=9)?"lng":""}">${esc(sn)}</span>${evN>1?`<span class="more">+${evN-1}</span>`:""}`:""}</button>`:`<span></span>`;
      });
      h+=`</div>`;
    }
    h+=`</div>`;
    if(st.sel){
      const [y,m,dd]=st.sel.split("-").map(Number),d=new Date(y,m-1,dd),ev=evsOf(st.sel),w=(d.getDay()+6)%7;
      const diff=Math.round((d-t)/864e5),rel=diff===0?"Bugün":diff===1?"Yarın":diff===-1?"Dün":diff>0?`${diff} gün sonra`:`${-diff} gün önce`;
      h+=`<div class="calInfo" id="calInfo"><h4>${dd} ${AY[m-1]} ${y}, ${DAYS[w]}</h4><div class="cw">${rel} · ${weekNo(d)}. hafta</div>${ev.length?ev.map(e=>`<div class="calEv"><i class="k-${e[1]}"></i>${esc(e[0])}<em>${KIND[e[1]]}</em></div>`).join(""):`<div class="calEv" style="color:var(--mut)">Özel bir gün yok</div>`}${calTasksHTML(st.sel)}</div>`;
    }
    const monthEv=Object.keys(OZEL).filter(k=>k.startsWith(st.y+"-"+String(st.m+1).padStart(2,"0"))).sort();
    if(monthEv.length){
      h+=`<div class="calList"><h5>${AY[st.m]} ${st.y} · özel günler</h5>`;
      monthEv.forEach(k=>{const [y,m,dd]=k.split("-").map(Number),d=new Date(y,m-1,dd);OZEL[k].forEach(e=>{h+=`<button class="calRow ${d<t?"past":""}" data-act="calday" data-d="${k}"><span class="cdt">${dd} ${AYK[m-1]}<small>${GUNK[(d.getDay()+6)%7]}</small></span><i class="k-${e[1]}"></i><span>${esc(e[0])}</span></button>`;});});
      h+=`</div>`;
    }
  }
  const sc=keep&&$("sheet")?$("sheet").scrollTop:null;
  openSheet("cal",h,true);
  if(sc!=null)$("sheet").scrollTop=sc;
  const box=$("calDays");
  if(box){let sx=null,sy=null;box.addEventListener("touchstart",e=>{if(e.touches.length===1){sx=e.touches[0].clientX;sy=e.touches[0].clientY;}},{passive:true});
    box.addEventListener("touchend",e=>{if(sx==null)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;sx=null;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5){calMove(dx<0?1:-1);dragEndAt=Date.now();}},{passive:true});}
}
// gece yarısı geçince tarihleri yenile
let lastDay=isoD(todayD());setInterval(()=>{const n=isoD(todayD());if(n!==lastDay){const was=sameD(tkMon,mondayOf(isoToD(lastDay)));lastDay=n;if(was)tkMon=mondayOf(todayD());render();}},60000);

/* ---------- iki parmakla yakınlaştırma (sadece tablo) ---------- */
let zoom=1;
function applyZoom(){const z=zoom===1?"":String(zoom);$("grid").style.zoom=z;$("tview").style.zoom=z;}
function setZoom(z,cx,cy){
  const tw=$("tblwrap"),old=zoom;
  const nz=Math.max(.4,Math.min(1.6,Math.round(z*100)/100));if(nz===old)return;
  const r=tw.getBoundingClientRect();
  const vx=cx!=null?cx-r.left:tw.clientWidth/2, vy=cy!=null?cy:innerHeight/2;
  const px=vx+tw.scrollLeft, topPage=r.top+scrollY, py=vy+scrollY-topPage;
  zoom=nz;applyZoom();
  const k=zoom/old;
  tw.scrollLeft=px*k-vx;
  window.scrollTo(scrollX,Math.max(0,topPage+py*k-vy));
  lsSet("hp-zoom",String(zoom));
  if($("tour"))placeTour();
}
(function(){
  const z=parseFloat(lsGet("hp-zoom"));if(z>=.4&&z<=1.6){zoom=z;applyZoom();}
  const tw=$("tblwrap");let pinch=null;
  const dist=(a,b)=>Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
  tw.addEventListener("touchstart",e=>{if(e.touches.length===2){if(typeof drag!=="undefined"&&drag)endDrag(false);pinch={d:dist(e.touches[0],e.touches[1]),z:zoom};}},{passive:true});
  tw.addEventListener("touchmove",e=>{if(!pinch||e.touches.length!==2)return;e.preventDefault();const[a,b]=e.touches;setZoom(pinch.z*dist(a,b)/pinch.d,(a.clientX+b.clientX)/2,(a.clientY+b.clientY)/2);},{passive:false});
  const end=e=>{if(pinch&&e.touches.length<2){pinch=null;dragEndAt=Date.now();}};
  tw.addEventListener("touchend",end,{passive:true});tw.addEventListener("touchcancel",end,{passive:true});
  tw.addEventListener("wheel",e=>{if(!e.ctrlKey)return;e.preventDefault();setZoom(zoom*Math.exp(-e.deltaY*.01),e.clientX,e.clientY);},{passive:false});
})();

/* ---------- tam ekran ---------- */
const fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;
function toggleFs(){
  const d=document.documentElement;
  try{
    if(fsEl()){(document.exitFullscreen||document.webkitExitFullscreen).call(document);}
    else{const r=(d.requestFullscreen||d.webkitRequestFullscreen).call(d);if(r&&r.catch)r.catch(()=>toast("Bu tarayıcı tam ekrana izin vermiyor"));}
  }catch(e){toast("Bu tarayıcı tam ekrana izin vermiyor");}
}
(function(){
  const can=!!(document.fullscreenEnabled||document.webkitFullscreenEnabled);
  const installed=matchMedia("(display-mode: fullscreen)").matches||matchMedia("(display-mode: standalone)").matches;
  $("fs").hidden=!can||installed;
  const up=()=>{const on=!!fsEl();document.documentElement.classList.toggle("isFs",on);$("fs").setAttribute("aria-label",on?"Tam ekrandan çık":"Tam ekran");};
  document.addEventListener("fullscreenchange",up);document.addEventListener("webkitfullscreenchange",up);
})();
