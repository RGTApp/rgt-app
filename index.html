<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Psikoloji Tarihi — Sınav Hazırlık</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0e0e0d;
    color: #e8e6e0;
    min-height: 100vh;
  }
  .screen { display: none; min-height: 100vh; }
  .screen.active { display: flex; flex-direction: column; }

  /* HOME */
  #home { align-items: center; justify-content: center; padding: 2rem 1.5rem; }
  .home-inner { width: 100%; max-width: 480px; }
  .home-badge {
    display: inline-block; font-size: 11px; letter-spacing: 0.1em;
    color: #EF9F27; background: rgba(239,159,39,0.12);
    border: 0.5px solid rgba(239,159,39,0.3); border-radius: 20px;
    padding: 4px 12px; margin-bottom: 1.5rem;
  }
  .home-title { font-size: 28px; font-weight: 600; color: #F1EFE8; line-height: 1.2; margin-bottom: 0.5rem; }
  .home-sub { font-size: 14px; color: #888780; margin-bottom: 2rem; line-height: 1.6; }

  .mastery-block {
    background: #141413; border: 0.5px solid #2a2a28; border-radius: 12px;
    padding: 1.25rem; margin-bottom: 1.5rem;
  }
  .mastery-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .mastery-title { font-size: 12px; color: #888780; letter-spacing: 0.04em; }
  .mastery-pct { font-size: 22px; font-weight: 600; color: #EF9F27; }
  .mastery-bar-bg { height: 4px; background: #2a2a28; border-radius: 2px; margin-bottom: 10px; }
  .mastery-bar-fill { height: 4px; background: #EF9F27; border-radius: 2px; transition: width 0.5s; }
  .mastery-stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .mstat { text-align: center; }
  .mstat-num { font-size: 16px; font-weight: 600; color: #D3D1C7; }
  .mstat-num.green { color: #1D9E75; }
  .mstat-num.red { color: #E24B4A; }
  .mstat-lbl { font-size: 11px; color: #555553; margin-top: 2px; }

  .name-label { font-size: 12px; color: #888780; letter-spacing: 0.04em; margin-bottom: 8px; }
  .name-input {
    width: 100%; background: #1a1a18; border: 0.5px solid #3a3a38; border-radius: 10px;
    padding: 12px 16px; font-size: 15px; color: #F1EFE8; outline: none; margin-bottom: 1.25rem;
    transition: border-color 0.15s;
  }
  .name-input:focus { border-color: #EF9F27; }
  .name-input::placeholder { color: #555553; }

  .btn-primary {
    width: 100%; background: #EF9F27; color: #0e0e0d; border: none; border-radius: 10px;
    padding: 14px; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: opacity 0.15s, transform 0.1s; margin-bottom: 10px;
  }
  .btn-primary:hover { opacity: 0.9; }
  .btn-primary:active { transform: scale(0.98); }
  .btn-secondary {
    width: 100%; background: transparent; color: #888780;
    border: 0.5px solid #3a3a38; border-radius: 10px;
    padding: 14px; font-size: 15px; cursor: pointer;
    transition: background 0.15s, color 0.15s; margin-bottom: 10px;
  }
  .btn-secondary:hover { background: #1a1a18; color: #D3D1C7; }
  .btn-outline-orange {
    width: 100%; background: transparent; color: #EF9F27;
    border: 0.5px solid rgba(239,159,39,0.4); border-radius: 10px;
    padding: 14px; font-size: 15px; cursor: pointer;
    transition: background 0.15s; margin-bottom: 10px;
  }
  .btn-outline-orange:hover { background: rgba(239,159,39,0.08); }

  /* QUIZ SCREEN */
  #quiz { padding: 0; }
  .quiz-topbar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 1.25rem 1.5rem 0.75rem; border-bottom: 0.5px solid #1e1e1c;
  }
  .quiz-meta { font-size: 12px; color: #666664; letter-spacing: 0.04em; }
  .quiz-streak { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #888780; }
  .progress-bar { height: 2px; background: #1e1e1c; flex-shrink: 0; }
  .progress-fill { height: 2px; background: #EF9F27; transition: width 0.4s ease; }

  .quiz-body { flex: 1; padding: 1.5rem; max-width: 640px; margin: 0 auto; width: 100%; }
  .level-badge { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: #666664; margin-bottom: 1rem; }
  .level-dot { width: 6px; height: 6px; border-radius: 50%; background: #2a2a28; }
  .level-dot.active { background: #EF9F27; }

  .question-text { font-size: 16px; font-weight: 500; color: #F1EFE8; line-height: 1.65; margin-bottom: 1.5rem; }
  .options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 1.5rem; }
  .opt-btn {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 13px 16px; background: #141413;
    border: 0.5px solid #2a2a28; border-radius: 10px;
    cursor: pointer; text-align: left;
    transition: border-color 0.12s, background 0.12s; width: 100%;
  }
  .opt-btn:hover:not(:disabled) { border-color: #4a4a48; background: #1a1a18; }
  .opt-btn:disabled { cursor: default; }
  .opt-letter {
    width: 26px; height: 26px; border-radius: 50%; border: 0.5px solid #3a3a38;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 500; color: #888780; flex-shrink: 0;
    transition: all 0.15s; margin-top: 1px;
  }
  .opt-text { font-size: 14px; color: #C8C6C0; line-height: 1.5; }

  .opt-btn.selected-correct { border-color: #1D9E75; background: rgba(29,158,117,0.08); }
  .opt-btn.selected-correct .opt-letter { background: #1D9E75; border-color: #1D9E75; color: #fff; }
  .opt-btn.selected-correct .opt-text { color: #9FE1CB; }

  .opt-btn.selected-wrong { border-color: #E24B4A; background: rgba(226,75,74,0.08); }
  .opt-btn.selected-wrong .opt-letter { background: #E24B4A; border-color: #E24B4A; color: #fff; }
  .opt-btn.selected-wrong .opt-text { color: #F09595; }

  .opt-btn.show-correct { border-color: #1D9E75; background: rgba(29,158,117,0.06); }
  .opt-btn.show-correct .opt-letter { background: #1D9E75; border-color: #1D9E75; color: #fff; }
  .opt-btn.show-correct .opt-text { color: #9FE1CB; }

  .explanation-box {
    background: #181817; border: 0.5px solid #2a2a28;
    border-left: 3px solid #EF9F27; border-radius: 0 10px 10px 0;
    padding: 1rem 1.25rem; margin-bottom: 1.25rem;
    animation: slideUp 0.25s ease;
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .exp-result { font-size: 13px; font-weight: 600; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 6px; }
  .exp-result.correct { color: #1D9E75; }
  .exp-result.wrong { color: #E24B4A; }
  .exp-text { font-size: 13px; color: #B4B2A9; line-height: 1.65; }
  .exp-text strong { color: #EF9F27; font-weight: 500; }

  .quiz-footer { padding: 0 1.5rem 1.5rem; max-width: 640px; margin: 0 auto; width: 100%; }
  .next-btn {
    width: 100%; background: #EF9F27; color: #0e0e0d; border: none; border-radius: 10px;
    padding: 14px; font-size: 15px; font-weight: 600; cursor: pointer;
    transition: opacity 0.15s; margin-bottom: 10px;
  }
  .next-btn:hover { opacity: 0.9; }

  /* 46 SORULAR EKRANI */
  #fulltest { padding: 0; }
  .fulltest-topbar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 1rem 1.5rem; border-bottom: 0.5px solid #1e1e1c; flex-shrink: 0;
  }
  .fulltest-meta { font-size: 13px; color: #888780; }
  .fulltest-meta span { color: #EF9F27; font-weight: 600; }
  .fulltest-body { flex: 1; padding: 1.5rem; max-width: 640px; margin: 0 auto; width: 100%; }
  .ft-progress-bar { height: 3px; background: #1e1e1c; }
  .ft-progress-fill { height: 3px; background: #EF9F27; transition: width 0.3s; }

  /* CEVAPLAR EKRANI */
  #allq { padding: 1.5rem; flex-direction: column; }
  .allq-header { display: flex; align-items: center; gap: 12px; margin-bottom: 1.5rem; }
  .back-btn {
    background: #1a1a18; border: 0.5px solid #2a2a28; border-radius: 8px;
    padding: 8px 14px; font-size: 13px; color: #888780; cursor: pointer;
  }
  .back-btn:hover { color: #F1EFE8; }
  .allq-title { font-size: 18px; font-weight: 500; color: #F1EFE8; }

  .q-item { background: #141413; border: 0.5px solid #2a2a28; border-radius: 12px; padding: 1.25rem; margin-bottom: 12px; max-width: 720px; }
  .q-num { font-size: 11px; color: #EF9F27; font-weight: 600; letter-spacing: 0.06em; margin-bottom: 8px; }
  .q-text { font-size: 14px; color: #D3D1C7; line-height: 1.6; margin-bottom: 10px; }
  .q-opts { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 10px; }
  .q-opt { font-size: 12px; color: #888780; padding: 6px 10px; background: #1a1a18; border-radius: 6px; border: 0.5px solid #2a2a28; line-height: 1.4; }
  .q-opt.is-correct { color: #9FE1CB; background: rgba(29,158,117,0.1); border-color: rgba(29,158,117,0.3); font-weight: 500; }
  .q-gerekce { font-size: 12px; color: #888780; background: #181817; border-left: 2px solid #EF9F27; padding: 8px 12px; border-radius: 0 6px 6px 0; line-height: 1.6; }

  /* RESULT */
  #result { align-items: center; justify-content: center; padding: 2rem 1.5rem; text-align: center; }
  .result-inner { max-width: 480px; width: 100%; }
  .result-score { font-size: 64px; font-weight: 700; color: #EF9F27; line-height: 1; margin-bottom: 0.25rem; }
  .result-label { font-size: 14px; color: #888780; margin-bottom: 2rem; }
  .result-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 1.5rem; }
  .result-card { background: #1a1a18; border: 0.5px solid #2a2a28; border-radius: 10px; padding: 1rem; }
  .result-card .num { font-size: 24px; font-weight: 600; color: #F1EFE8; }
  .result-card .lbl { font-size: 12px; color: #666664; margin-top: 2px; }
  .result-card.green .num { color: #1D9E75; }
  .result-card.red .num { color: #E24B4A; }
  .weak-section { text-align: left; margin-bottom: 1.5rem; }
  .weak-title { font-size: 12px; color: #888780; letter-spacing: 0.04em; margin-bottom: 8px; }
  .weak-item { font-size: 12px; color: #B4B2A9; background: #1a1a18; border: 0.5px solid #2a2a28; border-left: 2px solid #E24B4A; border-radius: 0 8px 8px 0; padding: 8px 12px; margin-bottom: 6px; line-height: 1.5; }
</style>
</head>
<body>

<!-- HOME -->
<div id="home" class="screen active">
  <div class="home-inner">
    <div class="home-badge">PSİKOLOJİ TARİHİ</div>
    <h1 class="home-title">Sınav Hazırlık</h1>
    <p class="home-sub">46 çıkmış soru · Sonsuz mod · Akıllı tekrar algoritması</p>

    <div id="mastery-block" class="mastery-block" style="display:none">
      <div class="mastery-header">
        <span class="mastery-title">EZBER DURUMU</span>
        <span class="mastery-pct" id="mastery-pct">0%</span>
      </div>
      <div class="mastery-bar-bg"><div class="mastery-bar-fill" id="mastery-bar" style="width:0%"></div></div>
      <div class="mastery-stats">
        <div class="mstat"><div class="mstat-num green" id="ms-correct">0</div><div class="mstat-lbl">Öğrendim</div></div>
        <div class="mstat"><div class="mstat-num red" id="ms-wrong">0</div><div class="mstat-lbl">Çalışıyorum</div></div>
        <div class="mstat"><div class="mstat-num" id="ms-total">0</div><div class="mstat-lbl">Toplam Cevap</div></div>
      </div>
    </div>

    <div class="name-label">ADINIZ</div>
    <input class="name-input" id="name-input" type="text" placeholder="Adınızı girin..." maxlength="30">
    <button class="btn-primary" onclick="startQuiz()">▶ Sonsuz Mod — Teste Başla</button>
    <button class="btn-outline-orange" onclick="startFullTest()">◈ 46 Soruyu Çöz</button>
    <button class="btn-secondary" onclick="showAllQuestions()">Cevapları Gör</button>
  </div>
</div>

<!-- SONSUZ MOD -->
<div id="quiz" class="screen">
  <div class="quiz-topbar">
    <div class="quiz-meta" id="quiz-meta">PSİKOLOJİ TARİHİ</div>
    <div class="quiz-streak">
      <span style="color:#EF9F27">◆</span>
      <span id="streak-count">0 seri</span>
    </div>
  </div>
  <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>

  <div class="quiz-body">
    <div class="level-badge">
      <div class="level-dot" id="ld1"></div><div class="level-dot" id="ld2"></div>
      <div class="level-dot" id="ld3"></div><div class="level-dot" id="ld4"></div>
      <div class="level-dot" id="ld5"></div>
      <span id="level-text" style="margin-left:4px;font-size:11px;color:#666664;"></span>
    </div>
    <div class="question-text" id="question-text"></div>
    <div class="options" id="options-container"></div>
    <div id="explanation-box" style="display:none" class="explanation-box">
      <div class="exp-result" id="exp-result"></div>
      <div class="exp-text" id="exp-text"></div>
    </div>
  </div>
  <div class="quiz-footer">
    <button class="next-btn" id="next-btn" style="display:none" onclick="nextQuestion()">Sonraki Soru →</button>
    <button class="btn-secondary" onclick="goHome()">Ana Sayfaya Dön</button>
  </div>
</div>

<!-- 46 SORULUK TAM TEST -->
<div id="fulltest" class="screen">
  <div class="ft-progress-bar"><div class="ft-progress-fill" id="ft-progress-fill" style="width:0%"></div></div>
  <div class="fulltest-topbar">
    <div class="fulltest-meta">Soru <span id="ft-current">1</span> / 46</div>
    <button class="back-btn" onclick="goHome()">✕ Çık</button>
  </div>
  <div class="fulltest-body">
    <div class="question-text" id="ft-question-text"></div>
    <div class="options" id="ft-options-container"></div>
    <div id="ft-explanation-box" style="display:none" class="explanation-box">
      <div class="exp-result" id="ft-exp-result"></div>
      <div class="exp-text" id="ft-exp-text"></div>
    </div>
  </div>
  <div class="quiz-footer">
    <button class="next-btn" id="ft-next-btn" style="display:none" onclick="ftNext()">Sonraki →</button>
    <button class="btn-secondary" onclick="goHome()">Ana Sayfaya Dön</button>
  </div>
</div>

<!-- CEVAPLAR -->
<div id="allq" class="screen">
  <div class="allq-header">
    <button class="back-btn" onclick="goHome()">← Geri</button>
    <span class="allq-title">Cevaplar ve Açıklamalar (46)</span>
  </div>
  <div id="allq-list"></div>
</div>

<!-- SONUÇ -->
<div id="result" class="screen">
  <div class="result-inner">
    <div class="result-score" id="res-score">0%</div>
    <div class="result-label" id="res-label"></div>
    <div class="result-grid">
      <div class="result-card green"><div class="num" id="res-correct">0</div><div class="lbl">Doğru</div></div>
      <div class="result-card red"><div class="num" id="res-wrong">0</div><div class="lbl">Yanlış</div></div>
      <div class="result-card"><div class="num" id="res-total">0</div><div class="lbl">Toplam</div></div>
      <div class="result-card"><div class="num" id="res-streak">0</div><div class="lbl">En Uzun Seri</div></div>
    </div>
    <div class="weak-section" id="weak-section"></div>
    <button class="btn-primary" onclick="startFullTest()">Tekrar Çöz</button>
    <button class="btn-outline-orange" style="margin-top:0" onclick="startQuiz()">Sonsuz Mod</button>
    <button class="btn-secondary" style="margin-top:0" onclick="goHome()">Ana Sayfaya Dön</button>
  </div>
</div>

<script>
// ══════════════════════════════════════════════
// SORU VERİTABANI
// ══════════════════════════════════════════════
const QUESTIONS = [
  {
    id:1,
    q:'"Başkalarından öğrenme, deneyim ve insanın kendini araştırması şeklinde üç tür bilginin olduğunu savunmuştur. Özellikle insanın kendini araştırmasından gelen bilginin bugün psikoterapide iç görü kavramının ilk örneği olduğu kabul edilmektedir." Yukarıda anlatılan düşünür aşağıdakilerden hangisidir?',
    opts:['Platon','Epiküros','Sokrates','Anaksimenes','Herakleitos'],
    answer:2,
    exp:'Sokrates felsefesinin özü "Kendini bil" ilkesidir. Dışarıdan öğrenme, deney ve özellikle insanın kendi içine dönerek ulaştığı öz-sorgulama bilgisi; modern psikoterapideki "içgörü" (insight) kavramının felsefi kökü kabul edilir. Platon (A) bilgiyi idealar dünyasına bağlar ve Sokrates\'in öğrencisidir. Epiküros (B) mutluluk ve hazdaki denge ile ilgilenir. Anaksimenes (D) arkheyi havaya bağlar, Herakleitos (E) ise sürekli değişim ve logos kavramıyla tanınır.'
  },
  {
    id:2,
    q:'"İnsan bir makine" isimli bir kitap yazmıştır. Bu kitapta insan bedenin bir makine, beynin ise çalışma ve kop uygun bir düşünme organı olduğu anlatılmaktadır. Bu eserin en önemli özelliği mekanistik dünya görüşünün bedene de uygulanmasını savunmasındadır. Yukarıda hakkında bilgi verilen filozof hangisidir?',
    opts:['de La Mettrie',"d'Hollbach",'Descartes','Gassendi','Locke'],
    answer:0,
    exp:'"L\'Homme Machine" (İnsan Bir Makinedir) adlı ünlü eser Julien Offray de La Mettrie\'ye aittir; insanı tamamen materyalist ve mekanik bir sistem olarak ele alır. Descartes (C) bedeni makine gibi görse de ruhu ayrı ve aşkın tutar (dualizm); beden-ruh ayrımı Descartes\'a aittir. d\'Hollbach (B) de materyalisttir ama bu eserin yazarı değildir. Gassendi (D) atomcu materyalizmi, Locke (E) ise ampirizmi temsil eder.'
  },
  {
    id:3,
    q:'"Aşağıdaki düşüncelerden hangisi Demokritos\'a atfedilemez?"',
    opts:['Determinizm','Amprizm','Atomculuk','Materyalizm','Nativizm'],
    answer:4,
    exp:'Demokritos, her şeyin bölünemez fiziksel parçacıklardan (atomlar) oluştuğunu ve bu atomların mekanik çarpışmalarla her şeyi belirlediğini (determinizm) savunur; bu nedenle atomculuk (C) ve materyalizm (D) ona aittir. Duyumların fiziksel atom izlenimleri aracılığıyla oluştuğunu söylediğinden ampirist bir damar da taşır (B). Nativizm (Doğuştancılık) ise zihinsel içeriklerin doğuştan geldiğini savunur; bu, atomcunun duyum temelli düşüncesiyle doğrudan çelişir.'
  },
  {
    id:4,
    q:'"EEG\'nin temelini atan bilim insanı hangisidir?"',
    opts:['Lasley','EAdrian','Gall','Berger','Müller'],
    answer:3,
    exp:'Hans Berger, insan beyninin elektriksel aktivitesini ilk kez kaydeden ve EEG cihazını geliştiren kişidir (1924). Lashley (A) beyin ve bellek ilişkisinde eşpotansiyellik yasasıyla, Adrian (B) sinir liflerindeki impuls iletimi çalışmalarıyla, Gall (C) frenoloji ile, Müller (E) sinirlerin özel enerjisi yasasıyla tanınır.'
  },
  {
    id:5,
    q:'"Aşağıda Thales konusunda verilen bilgilerden hangisi yanlıştır?"',
    opts:['Arhke arayışını başlatmıştır.','Tümevarımsal bir mantık gutmuştur','Doğa felsefesi anlayışı hakimdir','Evrenin ana maddesinin su olduğunu savunmuştur','Bilgi sorunu konusunda fikir üretmiştir'],
    answer:1,
    exp:'Thales, arkhe olarak suyu seçerek rasyonel-kozmolojik bir iddia ortaya koymuştur; ancak modern anlamda sistematik bir tümevarımsal mantık yürütmemiştir. Tümevarım (gözlemlerden genele gitmek) daha çok Aristoteles ve sonrasında bilimsel yöntemle olgunlaşmıştır. Doğa felsefesi (C), arkhe arayışı (A) ve su teorisi (D) kesinlikle ona aittir.'
  },
  {
    id:6,
    q:'"Eğitime verdikleri önem ile eğitim psikolojisinin ilk temsilcileri olarak kabul edilen düşünürler hangisidir?"',
    opts:['Pythagorasçılar','Sofistler','Pluralistler','Milet okulu','Elea okulu'],
    answer:1,
    exp:'Sofistler, antik dünyada ücret karşılığı ders veren, hitabet ve ikna sanatını öğreten ilk profesyonel öğretmenlerdir. İnsan davranışı, öğrenme ve zihni nasıl etkileyeceğine odaklandıkları için eğitim psikolojisinin öncüleri sayılırlar. Pythagorasçılar (A) sayı ve ahenk gibi matematiksel ilkelere, Milet okulu (D) doğanın maddesel temeline, Elea okulu (E) değişmez varlık ilkesine yönelir.'
  },
  {

let state = {
  userName: '',
  levels: {},
  totalAnswered: 0,
  totalCorrect: 0,
  streak: 0,
  maxStreak: 0,
  sessionCorrect: 0,
  sessionWrong: 0,
  sessionHistory: [],
  currentQ: null,
  answered: false,
  // full test
  ftIndex: 0,
  ftOrder: [],
  ftCorrect: 0,
  ftWrong: 0,
  ftMaxStreak: 0,
  ftStreak: 0,
  ftWrongIds: [],
  ftAnswered: false
};

function getKey(name) {
  return 'psytarih_' + (name||'anonim').toLowerCase().replace(/\s+/g,'_');
}

function loadState() {
  const name = document.getElementById('name-input').value.trim() || 'Anonim';
  state.userName = name;
  const saved = localStorage.getItem(getKey(name));
  if (saved) {
    const s = JSON.parse(saved);
    state.levels = s.levels || {};
    state.totalAnswered = s.totalAnswered || 0;
    state.totalCorrect = s.totalCorrect || 0;
  } else {
    state.levels = {};
    state.totalAnswered = 0;
    state.totalCorrect = 0;
  }
  QUESTIONS.forEach(q => {
    if (!state.levels[q.id]) state.levels[q.id] = 3;
  });
}

function saveState() {
  localStorage.setItem(getKey(state.userName), JSON.stringify({
    levels: state.levels,
    totalAnswered: state.totalAnswered,
    totalCorrect: state.totalCorrect
  }));
}

// ══════════════════════════════════════════
// ALGORİTMA — Hibrit Spaced Repetition
// Level 1 (çok zor) → her turda gelir
// Level 2 → her 2 soruda bir
// Level 3 → her 4 soruda bir
// Level 4 → her 8 soruda bir
// Level 5 (iyi biliyor) → her 15 soruda bir — UNUTMAMAK İÇİN GÖRÜNÜR
// ══════════════════════════════════════════
function pickNextQuestion() {
  const weights = { 1: 32, 2: 16, 3: 8, 4: 3, 5: 1 };
  const recent = state.sessionHistory.slice(-4);
  const pool = QUESTIONS.filter(q => !recent.includes(q.id));
  const src = pool.length >= 4 ? pool : QUESTIONS;

  const weighted = [];
  src.forEach(q => {
    const lvl = Math.max(1, Math.min(5, state.levels[q.id] || 3));
    const w = weights[lvl];
    for (let i = 0; i < w; i++) weighted.push(q);
  });

  const picked = weighted[Math.floor(Math.random() * weighted.length)];
  state.sessionHistory.push(picked.id);
  if (state.sessionHistory.length > 12) state.sessionHistory.shift();
  return picked;
}

// EKRAN
// ══════════════════════════════════════════
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}

function goHome() {
  updateMastery();
  showScreen('home');
}

function updateMastery() {
  const name = document.getElementById('name-input').value.trim() || 'Anonim';
  const saved = localStorage.getItem(getKey(name));
  if (!saved) return;
  const s = JSON.parse(saved);
  if (!s.totalAnswered || s.totalAnswered === 0) return;

  const levels = s.levels || {};
  let learned = 0;
  QUESTIONS.forEach(q => {
    if ((levels[q.id] || 3) >= 4) learned++;
  });
  const pct = Math.round(learned / QUESTIONS.length * 100);
  const working = QUESTIONS.filter(q => (levels[q.id] || 3) <= 2).length;

  document.getElementById('mastery-block').style.display = 'block';
  document.getElementById('mastery-pct').textContent = pct + '%';
  document.getElementById('mastery-bar').style.width = pct + '%';
  document.getElementById('ms-correct').textContent = learned;
  document.getElementById('ms-wrong').textContent = working;
  document.getElementById('ms-total').textContent = s.totalAnswered;
}

document.getElementById('name-input').addEventListener('input', updateMastery);

// SONSUZ MOD
// ══════════════════════════════════════════
function startQuiz() {
  loadState();
  state.sessionCorrect = 0;
  state.sessionWrong = 0;
  state.streak = 0;
  state.maxStreak = 0;
  state.sessionHistory = [];
  showScreen('quiz');
  renderQuestion();
}

function renderQuestion() {
  state.currentQ = pickNextQuestion();
  state.answered = false;
  const q = state.currentQ;

  const total = state.sessionCorrect + state.sessionWrong;
  const pct = total > 0 ? Math.round(state.sessionCorrect / total * 100) : 0;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('quiz-meta').textContent = 'PSİKOLOJİ TARİHİ · #' + q.id;
  document.getElementById('streak-count').textContent = state.streak + ' seri';

  const lvl = Math.max(1, Math.min(5, state.levels[q.id] || 3));
  for (let i = 1; i <= 5; i++) {
    document.getElementById('ld' + i).className = 'level-dot' + (i <= lvl ? ' active' : '');
  }
  const lvlLabels = ['','Öncelikli','Zor','Orta','İyi','Pekişti'];
  document.getElementById('level-text').textContent = lvlLabels[lvl];

  document.getElementById('question-text').textContent = q.q;
  renderOptions('options-container', q, (i) => selectAnswer(i));

  document.getElementById('explanation-box').style.display = 'none';
  document.getElementById('next-btn').style.display = 'none';
}

function selectAnswer(chosenIdx) {
  if (state.answered) return;
  state.answered = true;
  const q = state.currentQ;
  applyAnswerStyles('options-container', q, chosenIdx);
  const isCorrect = chosenIdx === q.answer;

  if (isCorrect) {
    state.levels[q.id] = Math.min(5, (state.levels[q.id] || 3) + 1);
    state.sessionCorrect++;
    state.streak++;
    state.maxStreak = Math.max(state.maxStreak, state.streak);
  } else {
    state.levels[q.id] = 1;
    state.sessionWrong++;
    state.streak = 0;
  }
  state.totalAnswered++;
  if (isCorrect) state.totalCorrect++;
  saveState();
  updateMastery();

  document.getElementById('streak-count').textContent = state.streak + ' seri';
  showExplanation('explanation-box', 'exp-result', 'exp-text', q, chosenIdx, isCorrect);
  document.getElementById('next-btn').style.display = 'block';
  setTimeout(() => document.getElementById('explanation-box').scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 100);
}

function nextQuestion() {
  renderQuestion();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// 46 SORULUK TAM TEST
// ══════════════════════════════════════════
function startFullTest() {
  loadState();
  // Sıralama: önce düşük level (zor/çalışılanlar), sonra yüksek level
  const sorted = [...QUESTIONS].sort((a, b) => {
    const la = state.levels[a.id] || 3;
    const lb = state.levels[b.id] || 3;
    return la - lb;
  });
  state.ftOrder = sorted;
  state.ftIndex = 0;
  state.ftCorrect = 0;
  state.ftWrong = 0;
  state.ftStreak = 0;
  state.ftMaxStreak = 0;
  state.ftWrongIds = [];
  state.ftAnswered = false;
  showScreen('fulltest');
  renderFTQuestion();
}

function renderFTQuestion() {
  state.ftAnswered = false;
  const q = state.ftOrder[state.ftIndex];
  const pct = Math.round(state.ftIndex / QUESTIONS.length * 100);
  document.getElementById('ft-progress-fill').style.width = pct + '%';
  document.getElementById('ft-current').textContent = state.ftIndex + 1;
  document.getElementById('ft-question-text').textContent = q.q;
  renderOptions('ft-options-container', q, (i) => ftSelectAnswer(i));
  document.getElementById('ft-explanation-box').style.display = 'none';
  document.getElementById('ft-next-btn').style.display = 'none';
}

function ftSelectAnswer(chosenIdx) {
  if (state.ftAnswered) return;
  state.ftAnswered = true;
  const q = state.ftOrder[state.ftIndex];
  applyAnswerStyles('ft-options-container', q, chosenIdx);
  const isCorrect = chosenIdx === q.answer;

  if (isCorrect) {
    state.levels[q.id] = Math.min(5, (state.levels[q.id] || 3) + 1);
    state.ftCorrect++;
    state.ftStreak++;
    state.ftMaxStreak = Math.max(state.ftMaxStreak, state.ftStreak);
  } else {
    state.levels[q.id] = 1;
    state.ftWrong++;
    state.ftStreak = 0;
    state.ftWrongIds.push(q.id);
  }
  state.totalAnswered++;
  if (isCorrect) state.totalCorrect++;
  saveState();
  updateMastery();

  showExplanation('ft-explanation-box', 'ft-exp-result', 'ft-exp-text', q, chosenIdx, isCorrect);
  const isLast = state.ftIndex >= QUESTIONS.length - 1;
  document.getElementById('ft-next-btn').textContent = isLast ? 'Sonuçları Gör →' : 'Sonraki →';
  document.getElementById('ft-next-btn').style.display = 'block';
  setTimeout(() => document.getElementById('ft-explanation-box').scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 100);
}

function ftNext() {
  if (state.ftIndex >= QUESTIONS.length - 1) {
    showResult();
    return;
  }
  state.ftIndex++;
  renderFTQuestion();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function showResult() {
  const total = QUESTIONS.length;
  const correct = state.ftCorrect;
  const wrong = state.ftWrong;
  const pct = Math.round(correct / total * 100);

  document.getElementById('res-score').textContent = pct + '%';
  document.getElementById('res-label').textContent = state.userName + ' · ' + correct + ' doğru / ' + wrong + ' yanlış';
  document.getElementById('res-correct').textContent = correct;
  document.getElementById('res-wrong').textContent = wrong;
  document.getElementById('res-total').textContent = total;
  document.getElementById('res-streak').textContent = state.ftMaxStreak;

  const weakSec = document.getElementById('weak-section');
  if (state.ftWrongIds.length > 0) {
    const items = state.ftWrongIds.map(id => {
      const q = QUESTIONS.find(x => x.id === id);
      return `<div class="weak-item"><strong style="color:#EF9F27">Soru ${id}:</strong> ${q.q.substring(0, 80)}...</div>`;
    }).join('');
    weakSec.innerHTML = `<div class="weak-title">YANLIŞ YAPILANLAR (${state.ftWrongIds.length})</div>${items}`;
  } else {
    weakSec.innerHTML = '<div style="color:#1D9E75;font-size:14px;margin-bottom:1rem">Tüm soruları doğru yaptın!</div>';
  }
  showScreen('result');
}

// ══════════════════════════════════════════
// CEVAPLAR
// ══════════════════════════════════════════
function showAllQuestions() {
  const list = document.getElementById('allq-list');
  list.innerHTML = '';
  const letters = ['A','B','C','D','E'];
  QUESTIONS.forEach(q => {
    const item = document.createElement('div');
    item.className = 'q-item';
    const optsHtml = q.opts.map((opt, i) =>
      `<div class="q-opt${i === q.answer ? ' is-correct' : ''}">${letters[i]}) ${opt}</div>`
    ).join('');
    item.innerHTML = `
      <div class="q-num">SORU ${q.id}</div>
      <div class="q-text">${q.q}</div>
      <div class="q-opts">${optsHtml}</div>
      <div class="q-gerekce"><strong style="color:#EF9F27">Gerekçe:</strong> ${q.exp}</div>
    `;
    list.appendChild(item);
  });
  showScreen('allq');
}

// ══════════════════════════════════════════
// YARDIMCI FONKSİYONLAR
// ══════════════════════════════════════════
function renderOptions(containerId, q, onClick) {
  const letters = ['A','B','C','D','E'];
  const container = document.getElementById(containerId);
  container.innerHTML = '';
  q.opts.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'opt-btn';
    btn.innerHTML = `<div class="opt-letter">${letters[i]}</div><div class="opt-text">${opt}</div>`;
    btn.onclick = () => onClick(i);
    container.appendChild(btn);
  });
}

function applyAnswerStyles(containerId, q, chosenIdx) {
  const btns = document.querySelectorAll('#' + containerId + ' .opt-btn');
  btns.forEach((btn, i) => {
    btn.disabled = true;
    if (i === chosenIdx && i === q.answer) btn.classList.add('selected-correct');
    else if (i === chosenIdx && i !== q.answer) btn.classList.add('selected-wrong');
    else if (i === q.answer && i !== chosenIdx) btn.classList.add('show-correct');
  });
}

function showExplanation(boxId, resultId, textId, q, chosenIdx, isCorrect) {
  const letters = ['A','B','C','D','E'];
  const box = document.getElementById(boxId);
  const res = document.getElementById(resultId);
  const txt = document.getElementById(textId);
  res.className = 'exp-result ' + (isCorrect ? 'correct' : 'wrong');
  res.textContent = isCorrect
    ? '✓ Doğru! Cevap: ' + letters[q.answer] + ') ' + q.opts[q.answer]
    : '✗ Yanlış. Doğru cevap: ' + letters[q.answer] + ') ' + q.opts[q.answer];
  txt.innerHTML = q.exp;
  box.style.display = 'block';
}

window.onload = () => { updateMastery(); };
</script>
